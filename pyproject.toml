[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cree-filesystem"
version = "0.1.0"
description = "A Unix-inspired filesystem simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cree-fs = "cree_filesystem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
